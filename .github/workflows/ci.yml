---
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 12

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22
          cache: pnpm
          persist-credentials: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 浏览器不缓存的话每次先下载 ~150MB；键含 lockfile 哈希（playwright-core 版本在其中）。
      # 命中时 `playwright install` 会跳过下载，仍会补装系统依赖。
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium for screenshot tests
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Typecheck
        run: pnpm check

      # 先构建：web.spec 的 SPA 回退用例需要 ui/dist 存在，否则 daemon 返回 404
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
