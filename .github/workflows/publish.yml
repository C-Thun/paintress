---
name: publish

# 发布不再重跑测试：同一提交的 ci.yml 已经把那一整套跑过了，这里只校验结论。
# 理由（2026-11-13，v0.5.0 发版事故）：同一份代码在两条流水线上跑同一套用例，
# 只会把抖动概率翻倍、把发版时间拉长，不产生任何新信号。
# 流程：等该提交的 ci 结论为 success → build → verify:pkg → npm publish。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_ci_check:
        description: 'ci 自身故障时强制发布：跳过 ci 结论校验（记录在本 run 里）'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write  # trusted publishing (OIDC)
  actions: read    # 读同一提交的 ci 运行结论

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 12

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install npm CLI with trusted publishing support
        # Node 22 自带的 npm 可能低于 11.5.1；OIDC trusted publishing 需要该版本以上。
        run: npm install -g npm@11.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 测试由 ci.yml 把关，这里只等它的结论 —— 不重复执行。
      # tag 通常在分支推送后几秒内推上来，所以这里要等它跑完。
      - name: Require green ci for this commit
        if: ${{ !inputs.skip_ci_check }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          api="repos/${REPO}/actions/workflows/ci.yml/runs"
          api="${api}?head_sha=${SHA}&per_page=1"
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            json=$(gh api "$api" 2>/dev/null) || {
              echo "查询 ci 运行失败，10s 后重试"
              sleep 10
              continue
            }
            status=$(jq -r '.workflow_runs[0].status // ""' <<<"$json")
            conclusion=$(jq -r '.workflow_runs[0].conclusion // ""' <<<"$json")
            url=$(jq -r '.workflow_runs[0].html_url // ""' <<<"$json")
            if [ -z "$status" ]; then
              echo "该提交还没有 ci 运行（等待中）"
            elif [ "$status" != "completed" ]; then
              echo "ci $status — $url"
            elif [ "$conclusion" = "success" ]; then
              echo "ci success — $url"
              exit 0
            else
              echo "::error::ci 结论 ${conclusion}，拒绝发布：${url}"
              echo "修好用例后：pnpm release --retag"
              echo "确认是 ci 自身故障：workflow_dispatch 勾 skip_ci_check"
              exit 1
            fi
            sleep 15
          done
          echo "::error::等待 ci 结论超时（10 分钟）"
          echo "先确认 ${SHA} 的 ci 运行状态，再重试。"
          exit 1

      - name: Build (server + viewer)
        run: pnpm build

      - name: Verify package contents
        run: pnpm verify:pkg

      - name: Check tag matches package version
        # workflow_dispatch 的 GITHUB_REF_NAME 是分支名，不是 tag；只在校验 tag 推送时执行。
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME 与 package.json 版本 $pkg 不一致" >&2
            exit 1
          fi

      - name: Publish with provenance
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          published() {
            npm view "${name}@${version}" version >/dev/null 2>&1
          }
          # dispatch 的用处之一是「不改版本号验证整条流水线」：已上架就跳过，不算失败。
          # tag 推送不跳：那种情况说明在重打一个已发布的版本，必须报错。
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && published; then
            echo "::notice::${name}@${version} 已在 registry 上，跳过发布"
            exit 0
          fi
          npm publish --provenance --access public
