---
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 12

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install npm CLI with trusted publishing support
        # Node 22 自带的 npm 可能低于 11.5.1；OIDC trusted publishing 需要该版本以上。
        run: npm install -g npm@11.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for screenshot tests
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Test
        run: pnpm test

      - name: Build (server + viewer)
        run: pnpm build

      - name: Verify package contents
        run: pnpm verify:pkg

      - name: Check tag matches package version
        # workflow_dispatch 的 GITHUB_REF_NAME 是分支名，不是 tag；只在校验 tag 推送时执行。
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME 与 package.json 版本 $pkg 不一致" >&2
            exit 1
          fi

      - name: Publish with provenance
        run: npm publish --provenance --access public
